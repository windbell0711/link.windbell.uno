<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>redirect</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main>
        <h1>redirect</h1>
        <div class="main-container" id="msg">Loading ...</div>
    </main>
</body>
<script>
    const code = new URLSearchParams(window.location.search).get("code");
    const root = window.location.host === "127.0.0.1:5500" ? "http://127.0.0.1:8000" : "";
    const msg = document.getElementById("msg");
    fetch(root + "/api/redirect?code=" + encodeURIComponent(code))
        .then(res => res.json())
        .then(data => {
            if (data.valid) {
                msg.textContent = `我们正在尝试将你重定向到：\n${data.url}\n预计需要 5 ~ 20 秒`;
                window.location.href = data.url;
            } else {
                msg.textContent = data.msg;
            }
        })
        .catch(() => {
            msg.textContent = code ? "服务异常，请联系开发者" : "错误：重定向目标code为空";
        });
</script>
</html>
