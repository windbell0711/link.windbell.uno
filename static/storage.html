<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>storage</title>
</head>
<body>
    <p>storage</p>
</body>
<script>
    const key = new URLSearchParams(window.location.search).get("key");
    const root = window.location.host === "127.0.0.1:5500" ? "http://127.0.0.1:8000" : "";
    fetch(root + "/api/storage?key=" + encodeURIComponent(key))
        .then(res => res.json())
        .then(data => {
            if (data.valid) {
                const videoElement = document.createElement('video');
                videoElement.src = data.url;
                videoElement.controls = true;
                document.body.appendChild(videoElement);
            } else {
                const h2 = document.createElement('h2');
                h2.textContent = data.msg;
                document.body.appendChild(h2);
            }
        })
        .catch(() => document.body.innerHTML = "<h2>服务异常，请联系开发者</h2>");
</script>
</html>
